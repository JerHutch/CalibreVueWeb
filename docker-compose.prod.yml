version: '3.8'

services:
  backend:
    container_name: calibre-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      - ${CALIBRE_DB_PATH}:/usr/src/app/calibre:ro
      - ${APP_DATA_PATH}:/usr/src/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - calibre-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  frontend:
    container_name: calibre-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calibre-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  calibre-network:
    driver: bridge

volumes:
  calibre_data:
