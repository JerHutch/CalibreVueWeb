version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      container_name: calibre-frontend
      # In development, mount source for hot reloading
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    ports:
      - "8888:8888"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      container_name: calibre-backend
    # In development, mount source for hot reloading
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ${CALIBRE_DB_PATH}:/calibre
    working_dir: /usr/src/app
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

networks:
  default:
    driver: bridge

volumes:
  calibre-db:
    driver: local


